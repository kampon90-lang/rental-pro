[workspace]
resolver = "2"
members = [
    "shared",
    "backend",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = { version = "0.15", default-features = false, features = ["std", "svg"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
thiserror = "2.0"

# Backend dependencies
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1.44", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
argon2 = { version = "0.5", features = ["std"] }
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
rustybuzz = "0.20"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
cookie = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
rust_xlsxwriter = "0.104"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

# Frontend dependencies
dioxus = { version = "0.7.10", features = ["web", "router"] }
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "RequestCredentials"] }
